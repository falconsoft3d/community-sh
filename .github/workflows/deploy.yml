# Every push to main: run the tests and, if they pass, deploy to the server over SSH
# (scripts/deploy.sh). Also runnable by hand from the Actions tab.
#
# Repository secrets (Settings → Secrets and variables → Actions → Secrets); all but the key can
# also be repository variables (same page, Variables tab):
#   DEPLOY_HOST          server name or IP (e.g. communitysh.xyz)
#   DEPLOY_USER          SSH user (root, or a user with passwordless sudo)
#   DEPLOY_SSH_KEY       private key allowed in that user's ~/.ssh/authorized_keys
#   DEPLOY_PORT          optional, SSH port (22)
#   DEPLOY_PATH          optional, install folder (/opt/community-sh)
#   DEPLOY_KNOWN_HOSTS   optional but recommended: output of `ssh-keyscan -H <host>`
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of cutting it
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The same database engine as production: SQLite hides problems (migrations, connections) Postgres shows
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: community_sh
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          DEBUG: 'True'
          DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/community_sh
        run: python manage.py test orchestrator --noinput

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # Not sensitive: a repository secret or a repository variable, whichever is set
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS || vars.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || '22' }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$USER" ] || missing="$missing DEPLOY_USER"
          [ -n "$SSH_KEY" ] || missing="$missing DEPLOY_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing:$missing. Add them in Settings → Secrets and variables → Actions → Secrets → New repository secret (not Codespaces or Dependabot)."
            exit 1
          fi
          case "$SSH_KEY" in
            *"PRIVATE KEY-----"*) ;;
            *) echo "::error::DEPLOY_SSH_KEY must be the whole private key file, from -----BEGIN … PRIVATE KEY----- to -----END … PRIVATE KEY-----"; exit 1 ;;
          esac
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS is not set: trusting the server key seen now"
            ssh-keyscan -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
          echo "Deploying to $USER@$HOST:$PORT"

      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || '22' }}
          DIR: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/opt/community-sh' }}
        # The script is taken from the commit being deployed, so changes to it apply right away
        run: |
          set -o pipefail
          # The output also goes to a file: when it fails, its last lines become the error shown in the run summary
          if ! ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes -o ServerAliveInterval=30 "$USER@$HOST" \
            "set -e; S=''; [ \"\$(id -u)\" = 0 ] || S='sudo -n'; \
             if ! \$S git -C '$DIR' rev-parse --git-dir >/dev/null 2>&1; then echo '$DIR is not a git checkout of community-sh'; exit 2; fi; \
             \$S git -C '$DIR' fetch --quiet origin main 2>&1; \
             \$S git -C '$DIR' show '${{ github.sha }}:scripts/deploy.sh' > /tmp/community-sh-deploy.sh; \
             \$S bash /tmp/community-sh-deploy.sh main '$DIR'" 2>&1 | tee deploy.log; then
            echo "::error title=Deploy failed::$(tail -n 8 deploy.log | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
