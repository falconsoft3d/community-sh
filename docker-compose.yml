# Logs of the panel's own services are capped too (a looping error can't fill the disk)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  traefik:
    logging: *default-logging
    image: "traefik:v2.5"
    command:
      - "--providers.docker=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Let's Encrypt: every route the panel writes to ./traefik gets its certificate
      # (the HTTP -> HTTPS redirect is per route, so localhost and the IP keep working)
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - "./letsencrypt:/letsencrypt"
      - "./traefik:/etc/traefik/dynamic"
    networks:
      - web
    restart: unless-stopped

  db:
    logging: *default-logging
    image: postgres:15
    # Back after a reboot or a restart of Docker: without it the panel answers 500 (no database)
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=community_sh
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d community_sh"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Internal network only: Odoo/user containers join "web" and must not reach the panel DB
    networks:
      - backend

  app:
    logging: *default-logging
    build: .
    image: community-sh-app
    restart: always
    # Deploys/backups run in the worker; the timeout covers certbot and instance deletion
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 4 --timeout 300
    ports:
      # With a domain the panel is reached through Traefik (HTTPS): PANEL_BIND=127.0.0.1 keeps the
      # plain-HTTP port off the internet. Without a domain http://IP:8000 is the way in.
      - "${PANEL_BIND:-0.0.0.0}:8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      # IMPORTANT: This must match the absolute path on the HOST machine
      - HOST_WORKDIR=${HOST_WORKDIR}
      - SERVER_IP=${SERVER_IP}
      - MAIN_DOMAIN=${MAIN_DOMAIN:-}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-}
      - TICKETPROO_API_TOKEN=${TICKETPROO_API_TOKEN:-}
      # Docker through the filtering proxy, never the raw socket (see the docker-proxy service)
      - DOCKER_HOST=tcp://docker-proxy:2375
    volumes:
      # The code is read-only here: a bug in a page can't change the code the workers (which do have
      # the Docker socket) run. Only the data folders are writable. PANEL_CODE_MOUNT=rw for SQLite installs
      # (db.sqlite3 lives in the project folder); scripts/deploy.sh sets it.
      - ./:/app:${PANEL_CODE_MOUNT:-ro}
      - ./media:/app/media
      - ./backups:/app/backups
      - ./instances:/app/instances
      - ./letsencrypt:/app/letsencrypt
      - ./letsencrypt:/opt/community-sh/letsencrypt
      - ./traefik:/app/traefik
      - ./staticfiles:/app/staticfiles
      - ./ai_attachments:/app/ai_attachments
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`localhost`)"
      - "traefik.http.routers.app.entrypoints=web"
      - "traefik.http.services.app.loadbalancer.server.port=8000"
    depends_on:
      db:
        condition: service_healthy
      docker-proxy:
        condition: service_healthy
    networks:
      - web
      - backend
      - docker-api

  # The web container's only way to Docker: lets through what the panel does (logs, console, start/stop,
  # generic containers, the Docker page) and refuses what would give the server away (privileged containers,
  # host folders outside instances/, entering the panel's own containers...). scripts/docker_proxy.py,
  # run from the image (not the mounted code, which the web container could otherwise change).
  docker-proxy:
    logging: *default-logging
    image: community-sh-app
    # Built by the app service: never look for it on Docker Hub
    pull_policy: never
    restart: always
    entrypoint: ["python", "/app/scripts/docker_proxy.py"]
    environment:
      - HOST_WORKDIR=${HOST_WORKDIR}
      # Extra host folders generic containers may mount (comma separated), e.g. /srv/data
      - DOCKER_PROXY_ALLOWED_BINDS=${DOCKER_PROXY_ALLOWED_BINDS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # At their host path, read-only: to see symlinks planted in a folder before letting it be mounted
      - ./instances:${HOST_WORKDIR:-/opt/community-sh}/instances:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 2375), 2)"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Internal network only: just the web container reaches it
    networks:
      - docker-api

  # Runs queued tasks (deploys, backups, restores) and the scheduled backups.
  # Keep a single worker: it marks tasks left running by a previous worker as failed.
  worker:
    logging: *default-logging
    image: community-sh-app
    # Built by the app service: never look for it on Docker Hub
    pull_policy: never
    restart: always
    command: python manage.py run_worker --exclude ai_chat --exclude odoo_migration --exclude build_container
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      - DEBUG=${DEBUG:-False}
      - HOST_WORKDIR=${HOST_WORKDIR}
      - SERVER_IP=${SERVER_IP}
      - MAIN_DOMAIN=${MAIN_DOMAIN:-}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-}
      - RUN_MIGRATIONS=false
    # Same code and data as the app (db.sqlite3 is not baked into the image)
    volumes:
      - ./:/app
      - ./media:/app/media
      - ./backups:/app/backups
      - ./instances:/app/instances
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      app:
        condition: service_started
    # web: git clones need internet; backend: panel database
    networks:
      - web
      - backend

  # Builds the images of generic containers from their repository (minutes for a large app)
  # without holding up deploys and backups.
  build-worker:
    logging: *default-logging
    image: community-sh-app
    # Built by the app service: never look for it on Docker Hub
    pull_policy: never
    restart: always
    command: python manage.py run_worker --only build_container
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      - DEBUG=${DEBUG:-False}
      - HOST_WORKDIR=${HOST_WORKDIR}
      - SERVER_IP=${SERVER_IP}
      - MAIN_DOMAIN=${MAIN_DOMAIN:-}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-}
      - RUN_MIGRATIONS=false
    volumes:
      - ./:/app
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      app:
        condition: service_started
    # web: git clones and image builds need internet; backend: panel database
    networks:
      - web
      - backend

  # Runs the long jobs that don't touch Docker (AI assistant requests, migrations from another
  # Odoo) without holding up deploys and backups. Edits the instances' addons folders.
  ai-worker:
    logging: *default-logging
    image: community-sh-app
    # Built by the app service: never look for it on Docker Hub
    pull_policy: never
    restart: always
    command: python manage.py run_worker --only ai_chat --only odoo_migration
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      - DEBUG=${DEBUG:-False}
      - HOST_WORKDIR=${HOST_WORKDIR}
      - RUN_MIGRATIONS=false
    volumes:
      - ./:/app
      - ./instances:/app/instances
    depends_on:
      app:
        condition: service_started
    networks:
      - web
      - backend

networks:
  web:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  docker-api:
    driver: bridge
    internal: true

volumes:
  postgres_data:
