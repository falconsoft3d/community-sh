services:
  traefik:
    image: "traefik:v2.5"
    command:
      - "--providers.docker=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Let's Encrypt configuration
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@example.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # HTTP to HTTPS redirect (commented out for .local domains)
      # - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      # - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - "./letsencrypt:/letsencrypt"
      - "./traefik:/etc/traefik/dynamic"
    networks:
      - web
    restart: unless-stopped

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=community_sh
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d community_sh"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Internal network only: Odoo/user containers join "web" and must not reach the panel DB
    networks:
      - backend

  app:
    build: .
    image: community-sh-app
    restart: always
    # Long timeout: deploys/backups still run inside the request (see Phase 3)
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 4 --timeout 900
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      # IMPORTANT: This must match the absolute path on the HOST machine
      - HOST_WORKDIR=${HOST_WORKDIR}
      - SERVER_IP=${SERVER_IP}
    volumes:
      - ./:/app
      - ./media:/app/media
      - ./backups:/app/backups
      - ./instances:/app/instances
      - ./letsencrypt:/opt/community-sh/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`localhost`)"
      - "traefik.http.routers.app.entrypoints=web"
      - "traefik.http.services.app.loadbalancer.server.port=8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
      - backend

  cron:
    image: community-sh-app
    restart: always
    command: /bin/sh -c "while true; do python manage.py run_auto_backups; sleep 60; done"
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      - DEBUG=${DEBUG:-False}
      - HOST_WORKDIR=${HOST_WORKDIR}
      - RUN_MIGRATIONS=false
    # Same code and data as the app (db.sqlite3 is not baked into the image)
    volumes:
      - ./:/app
      - ./media:/app/media
      - ./backups:/app/backups
      - ./instances:/app/instances
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      app:
        condition: service_started
    networks:
      - backend

networks:
  web:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  postgres_data:
