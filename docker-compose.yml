services:
  traefik:
    image: "traefik:v3.0"
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Let's Encrypt configuration
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@example.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # HTTP to HTTPS redirect (commented out for .local domains)
      # - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      # - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Dashboard
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
      - "./traefik:/etc/traefik/dynamic"
    networks:
      - web
    restart: unless-stopped

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=community_sh
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    networks:
      - web

  app:
    build: .
    image: community-sh-app
    restart: always
    command: python manage.py runserver 0.0.0.0:8000 --insecure
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@db:5432/community_sh}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-your-secret-key-here}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      # IMPORTANT: This must match the absolute path on the HOST machine
      - HOST_WORKDIR=${HOST_WORKDIR}
      - SERVER_IP=${SERVER_IP}
    volumes:
      - ./:/app
      - ./media:/app/media
      - ./backups:/app/backups
      - ./instances:/app/instances
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`localhost`)"
      - "traefik.http.routers.app.entrypoints=web"
      - "traefik.http.services.app.loadbalancer.server.port=8000"
    depends_on:
      - db
    networks:
      - web

  cron:
    image: community-sh-app
    restart: always
    command: /bin/sh -c "while true; do python manage.py run_auto_backups; sleep 60; done"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/community_sh
      - DJANGO_SECRET_KEY=django-insecure-your-secret-key-here
      - DEBUG=False
    volumes:
      - ./media:/app/media
      - ./backups:/app/backups
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - db
    networks:
      - web

networks:
  web:
    driver: bridge

volumes:
  postgres_data:
