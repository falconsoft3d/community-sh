services:
  traefik:
    image: "traefik:v2.5"
    command:
      - "--providers.docker=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Let's Encrypt: every route the panel writes to ./traefik gets its certificate
      # (the HTTP -> HTTPS redirect is per route, so localhost and the IP keep working)
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - "./letsencrypt:/letsencrypt"
      - "./traefik:/etc/traefik/dynamic"
    networks:
      - web
    restart: unless-stopped

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=community_sh
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d community_sh"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Internal network only: Odoo/user containers join "web" and must not reach the panel DB
    networks:
      - backend

  app:
    build: .
    image: community-sh-app
    restart: always
    # Deploys/backups run in the worker; the timeout covers certbot and instance deletion
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 4 --timeout 300
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      # IMPORTANT: This must match the absolute path on the HOST machine
      - HOST_WORKDIR=${HOST_WORKDIR}
      - SERVER_IP=${SERVER_IP}
      - MAIN_DOMAIN=${MAIN_DOMAIN:-}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-}
      - TICKETPROO_API_TOKEN=${TICKETPROO_API_TOKEN:-}
    volumes:
      - ./:/app
      - ./media:/app/media
      - ./backups:/app/backups
      - ./instances:/app/instances
      - ./letsencrypt:/opt/community-sh/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`localhost`)"
      - "traefik.http.routers.app.entrypoints=web"
      - "traefik.http.services.app.loadbalancer.server.port=8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
      - backend

  # Runs queued tasks (deploys, backups, restores) and the scheduled backups.
  # Keep a single worker: it marks tasks left running by a previous worker as failed.
  worker:
    image: community-sh-app
    # Built by the app service: never look for it on Docker Hub
    pull_policy: never
    restart: always
    command: python manage.py run_worker --exclude ai_chat --exclude odoo_migration
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      - DEBUG=${DEBUG:-False}
      - HOST_WORKDIR=${HOST_WORKDIR}
      - SERVER_IP=${SERVER_IP}
      - MAIN_DOMAIN=${MAIN_DOMAIN:-}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-}
      - RUN_MIGRATIONS=false
    # Same code and data as the app (db.sqlite3 is not baked into the image)
    volumes:
      - ./:/app
      - ./media:/app/media
      - ./backups:/app/backups
      - ./instances:/app/instances
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      app:
        condition: service_started
    # web: git clones need internet; backend: panel database
    networks:
      - web
      - backend

  # Runs the long jobs that don't touch Docker (AI assistant requests, migrations from another
  # Odoo) without holding up deploys and backups. Edits the instances' addons folders.
  ai-worker:
    image: community-sh-app
    # Built by the app service: never look for it on Docker Hub
    pull_policy: never
    restart: always
    command: python manage.py run_worker --only ai_chat --only odoo_migration
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      - DEBUG=${DEBUG:-False}
      - HOST_WORKDIR=${HOST_WORKDIR}
      - RUN_MIGRATIONS=false
    volumes:
      - ./:/app
      - ./instances:/app/instances
    depends_on:
      app:
        condition: service_started
    networks:
      - web
      - backend

networks:
  web:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  postgres_data:
