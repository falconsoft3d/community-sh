{# Polls the tasks of the page that are running or waiting and moves their bars, steps and logs. reload_when_done: reload once all of them finish; full_log: the whole log, not its end #}
<script>
    (function () {
        const url = "{% url 'task-live' %}";
        const reloadWhenDone = {{ reload_when_done|yesno:"true,false" }};
        const full = {{ full_log|yesno:"true,false" }} ? '&full=1' : '';
        const BAR = { pending: 'bg-muted-foreground/40', running: 'bg-blue-500 animate-pulse', done: 'bg-green-500', failed: 'bg-red-500' };
        const BADGE = { pending: 'bg-muted text-muted-foreground', running: 'bg-blue-100 text-blue-800', done: 'bg-green-100 text-green-800', failed: 'bg-red-100 text-red-800' };
        const activeIds = () => [...document.querySelectorAll('[data-task-id][data-task-active]')].map(row => row.dataset.taskId);
        const startedWithActive = activeIds().length > 0;

        function update(task) {
            const row = document.querySelector(`[data-task-id="${task.id}"]`);
            if (!row) return;
            const bar = row.querySelector('[data-task-bar]');
            bar.style.width = task.progress + '%';
            bar.className = 'h-full rounded-full transition-all duration-500 ' + (BAR[task.status] || BAR.pending);
            bar.parentElement.setAttribute('aria-valuenow', task.progress);
            row.querySelector('[data-task-percent]').textContent = task.progress + '%';
            if (task.step) row.querySelector('[data-task-step]').textContent = task.step;
            const badge = row.querySelector('[data-task-status]');
            badge.textContent = task.status_display;
            badge.className = 'inline-flex w-24 shrink-0 items-center justify-center rounded-full px-2 py-0.5 text-xs font-medium ' + (BADGE[task.status] || BADGE.pending);
            const duration = row.querySelector('[data-task-duration]');
            if (duration && task.duration_display) duration.textContent = task.duration_display;
            const log = row.querySelector('[data-task-log]');
            if (log && task.log && log.textContent !== task.log) {
                // Follow the end of the log unless the user scrolled up to read
                const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
                log.textContent = task.log;
                if (atBottom) log.scrollTop = log.scrollHeight;
            }
            if (!task.active) row.removeAttribute('data-task-active');
        }

        async function poll() {
            const ids = activeIds();
            if (!ids.length) {
                if (reloadWhenDone && startedWithActive) window.location.reload();
                return;
            }
            try {
                const response = await fetch(url + '?ids=' + ids.join(',') + full, { headers: { 'Accept': 'application/json' } });
                const data = await response.json();
                data.tasks.forEach(update);
            } catch (error) {
                // The next round tries again
            }
            setTimeout(poll, 2000);
        }

        document.querySelectorAll('[data-task-log]').forEach(log => { log.scrollTop = log.scrollHeight; });
        if (startedWithActive) setTimeout(poll, 1500);
    })();
</script>
